<!DOCTYPE html>
<html>
  <head>
    <title>Highlighter</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
      body {
        min-width: 250px;
        font-family: 'Roboto', Arial, sans-serif;
        background: #f7f7fa;
        margin: 0;
        padding: 20px 15px 15px 15px;
      }
      h3 {
        margin-top: 0;
        color: #4a90e2;
        font-weight: 700;
        font-size: 1.2em;
        letter-spacing: 1px;
      }
      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 12px;
        font-size: 1em;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background: linear-gradient(90deg, #4a90e2 0%, #357ab8 100%);
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 1em;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .footer {
        margin-top: 15px;
        text-align: center;
        font-size: 0.9em;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <h3>Highlight Keywords</h3>
    <input type="text" id="keywords" placeholder="Enter keywords, comma separated" />
    <button id="highlightBtn">Highlight</button>
    <div class="footer">Powered by Highlighter</div>
    <script src="popup.js"></script>
  </body>
</html>
