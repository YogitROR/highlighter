<!DOCTYPE html>
<html>
  <head>
    <title>Highlighter</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="popup.css" rel="stylesheet">
  </head>
  <body>
    <div class="container p-3">
      <!-- Highlighter Section -->
      <h5 class="text-primary mb-3">Highlight Keywords</h5>
      
      <div class="mb-3">
        <input type="text" 
               class="form-control mb-2" 
               id="keywords" 
               placeholder="Enter keywords, comma separated">
        
        <button id="highlightBtn" 
                class="btn btn-primary w-100 mb-3">
          Highlight
        </button>
      </div>

      <!-- Stats Card - Moved below the button -->
      <div class="card">
        <div class="card-body">
          <div class="row text-center">
            <div class="col-6 border-end">
              <h6 class="text-muted mb-1">Total Links</h6>
              <span id="linkCount" class="fw-bold text-primary">...</span>
            </div>
            <div class="col-6">
              <h6 class="text-muted mb-1">External Links</h6>
              <span id="externalCount" class="fw-bold text-primary">...</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center text-muted small mt-3">
        <span class="border-top pt-2">Powered by Highlighter</span>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
